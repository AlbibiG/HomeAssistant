type: custom:mod-card
card_mod:
  style: |
    ha-card {
      position: fixed !important;
      bottom: 20px !important;
      left: 50% !important;
      /* This shifts the card back by half its own width to truly center it */
      transform: translateX(-50%) !important; 
      
      /* For a perfect circle, width and height must be equal pixels */
      width: 80px !important;
      height: 80px !important;
      border-radius: 50% !important; /* 50% creates a circle */
      
      background: rgba(25, 25, 25, 0.5) !important;
      backdrop-filter: blur(15px) !important;
      z-index: 1000 !important;
      border: 1px solid rgba(255, 255, 255, 0.15) !important;
      box-shadow: 0px 10px 30px rgba(0,0,0,0.6) !important;
      display: flex !important;
      align-items: center !important;
      justify-content: center !important;
    }
card:
  type: custom:button-card
  template: nav_button_style
  icon: mdi:home
  variables:
    path: home
  tap_action:
    action: navigate
    navigation_path: home
  styles:
    card:
      - width: 80px !important;
      - height: 80px !important;
      - background: transparent !important;
      - border-radius: 50% !important;
      - box-shadow: none !important;
    icon:
      - width: 40px

