type: custom:bubble-card
card_type: media-player
name: Bedroom Kodi
entity: media_player.bedroom_kodi
card_layout: large
show_icon: false
rows: 2
cover_background: false
hide:
  play_pause_button: true
  volume_button: true
  previous_button: true
  next_button: true
  power_button: true
styles: |
  .bubble-title {
    -webkit-text-stroke: 0.5px #000;
    text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.5);
  }
  .bubble-container {
    background: rgba(0, 0, 0, 0.7) !important;
    backdrop-filter: blur(2px) !important;
    box-shadow: none !important;
    border-radius: 0px !important;
  }
  .bubble-sub-button {
    background-color: rgba(255, 255, 255, 0.15) !important;
  }
sub_button:
  main:
    - type: custom:bubble-card
      card_type: button
      entity: media_player.tcl_tv
      icon: mdi:volume-mute
      tap_action:
        action: perform-action
        perform_action: script.mute_toggle
        data:
          source: media_player.tcl_tv
    - type: custom:bubble-card
      card_type: button
      entity: media_player.tcl_tv
      icon: mdi:volume-minus
      tap_action:
        action: perform-action
        perform_action: media_player.volume_down
        target:
          entity_id: media_player.tcl_tv
    - type: custom:bubble-card
      card_type: button
      button_type: slider
      entity: media_player.tcl_tv
      show_attribute: true
      attribute: volume_level
      tap_action: none
    - type: custom:bubble-card
      card_type: button
      entity: media_player.tcl_tv
      icon: mdi:volume-plus
      tap_action:
        action: perform-action
        perform_action: media_player.volume_up
        target:
          entity_id: media_player.tcl_tv
  bottom: !include kodi_transport_buttons.yaml
