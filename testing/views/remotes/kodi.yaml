type: custom:vertical-stack-in-card
card_mod:
  style: |
    ha-card {
      background-image: url('https://image.tmdb.org/t/p/w500{{ states("input_text.kodi_poster_path") }}') !important;
      background-size: cover !important;
      background-position: center !important;
      background-repeat: no-repeat !important;
      border-radius: 8px !important;
      border: 0px !important;
    }
cards:
  - type: horizontal-stack
    cards:
      - type: custom:bubble-card
        card_type: select
        entity: input_select.kodi_player
        show_state: true
        show_icon: true
        show_name: false
        styles: |
          .bubble-container {
            background: transparent !important;
            max-width: 175px !important;
          }
          .bubble-dropdown-arrow {
            background: transparent !important;
          }
          .bubble-state {
            -webkit-text-stroke: 0.25px #000;
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.5);
          }
      - type: custom:bubble-card
        card_type: select
        entity: input_select.kodi_profile
        show_state: true
        show_icon: true
        show_name: false
        tap_action:
          action: call-service
          service: script.universal_remote
          data:
            control: 'LoadProfile'
        styles: |
          .bubble-icon-container {
            position: absolute;
            right: 30px;
            left: auto;
          }
          .bubble-container {
            background: transparent !important;
            max-width: 175px !important;
            margin-left: auto !important;
          }
          .bubble-dropdown-arrow {
            background: transparent !important;
          }
          .bubble-state {
            -webkit-text-stroke: 0.25px #000;
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.5);
          }
  - !include shared_controls.yaml
  - type: conditional
    conditions:
      - entity: input_select.kodi_player
        state: CoreELEC
    card: !include kodi_coreelec_inputs.yaml
  - type: conditional
    conditions:
      - entity: input_select.kodi_player
        state: CoreELEC
    card: !include kodi_coreelec_player.yaml
  - type: conditional
    conditions:
      - entity: input_select.kodi_player
        state: Bedroom Kodi
    card: !include kodi_bedroom_player.yaml
  - type: custom:button-card
    triggers_update:
      - sensor.kodi_selected_player
      - media_player.coreelec
      - media_player.bedroom_kodi
    show_icon: false
    show_name: false
    show_state: false
    custom_fields:
      progress: |
        [[[
          const player = states[states['sensor.kodi_selected_player']?.state];
          const duration = Number(player?.attributes.media_duration) || 0;
          const position = Number(player?.attributes.media_position) || 0;
          const percentage = duration ? Math.min(100, (position / duration) * 100) : 0;
          return `<div style="background: white; height: 100%; width: ${percentage}%; transition: width 0.5s linear;"></div>`;
        ]]]
    styles:
      card:
        - background: transparent
        - border-radius: 0 0 8px 8px
        - box-shadow: none
        - height: 8px
        - padding: 0
        - overflow: hidden
      grid:
        - grid-template-areas: '"progress"'
        - grid-template-columns: 100%
        - grid-template-rows: 100%
      custom_fields:
        progress:
          - background: rgba(255, 255, 255, 0.25)
          - border-top: 1px solid rgb(0, 0, 0)
          - border-radius: 0 0 8px 8px
          - box-sizing: border-box
          - height: 8px
          - width: 100%
