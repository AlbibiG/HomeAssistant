title: Remote
path: remote
cards:
  - !include ../media_navbar.yaml
  - type: vertical-stack
    cards:
    - type: custom:button-card
      name: Remote
      styles:
        card:
          - background: none
          - border: none
          - box-shadow: none
          - padding: 0px 0px 0px 5%
          - text-align: left
        name:
          - justify-self: start
          - font-size: 28px
          - font-weight: 700
          - color: white
        label:
          - justify-self: start
          - font-size: 14px
          - color: rgba(255, 255, 255, 0.5)
    - type: custom:bubble-card
      card_type: separator
      name: Device
      icon: mdi:remote
      sub_button:
        - entity: input_select.remote_control
          show_state: true
          show_background: false
          show_icon: false
    - type: conditional
      conditions:
      - condition: or
        conditions:
          - entity: input_select.remote_control
            state: "Kodi"
          - entity: input_select.remote_control
            state: "Living TV"
          - entity: input_select.remote_control
            state: "Bedroom TV"
      card:
        type: vertical-stack
        cards:
        - type: custom:vertical-stack-in-card
          card_mod:
            style: |
              ha-card {
                padding: 10px;
              }
          cards:
            - type: horizontal-stack
              cards:
                - type: button
                  icon: mdi:power
                  show_name: false
                  show_state: false
                  tap_action:
                    action: perform-action
                    perform_action: script.universal_remote
                    data:
                      control: Master_Power
                  card_mod:
                    style: |
                      ha-card {
                        width: 60px !important;
                        height: 60px !important;
                        
                        border-radius: 50% !important;
                        
                        display: flex !important;
                        align-items: center !important;
                        justify-content: center !important;
                        
                        margin: 0 auto !important;
                        background: red !important;
                      }
                - type: custom:button-card
                  entity: switch.bass_shaker_amp_outlet
                  show_name: false
                  state:
                    - value: "on"
                      icon: mdi:amplifier
                      styles:
                        icon:
                          - color: "#228B22" # Green when on
                    - value: "off"
                      icon: mdi:amplifier-off
                      styles:
                        icon:
                          - color: "#666666" # Grey when off
                  tap_action:
                    action: toggle
                  styles:
                    card:
                      - width: 60px
                      - height: 60px
                      - border-radius: 50%
                      - background: black
                      - display: flex
                      - align-items: center
                      - justify-content: center
                      - margin: 0 auto
                - type: button
                  icon: mdi:power
                  show_name: false
                  show_state: false
                  tap_action:
                    action: perform-action
                    perform_action: script.universal_remote
                    data:
                      control: Power
                  card_mod:
                    style: |
                      ha-card {
                        width: 60px !important;
                        height: 60px !important;
                        
                        border-radius: 50% !important;
                        
                        display: flex !important;
                        align-items: center !important;
                        justify-content: center !important;
                        
                        margin: 0 auto !important;
                        background: grey !important;
                      }
            - type: custom:button-card
              color_type: blank-card
              styles:
                card:
                  - height: 10px
            - type: grid
              columns: 3
              square: true
              cards:
                - type: custom:button-card
                  color_type: blank-card
                - type: button
                  icon: mdi:chevron-up
                  show_name: false
                  show_state: false
                  tap_action:
                    action: perform-action
                    perform_action: script.universal_remote
                    data:
                      control: Up
                  card_mod:
                    style: |
                      ha-card {
                        background: rgba(255, 255, 255, 0.05) !important;
                        border-radius: 20px 20px 5px 5px !important;
                      }
                - type: custom:button-card
                  color_type: blank-card
                - type: button
                  icon: mdi:chevron-left
                  show_name: false
                  show_state: false
                  tap_action:
                    action: perform-action
                    perform_action: script.universal_remote
                    data:
                      control: Left
                  card_mod:
                    style: |
                      ha-card {
                        background: rgba(255, 255, 255, 0.05) !important;
                        border-radius: 20px 5px 5px 20px !important;
                      }
                - type: button
                  name: Enter
                  show_name: true
                  tap_action:
                    action: perform-action
                    perform_action: script.universal_remote
                    data:
                      control: Enter
                  hold_action:
                    action: perform-action
                    perform_action: script.universal_remote
                    data:
                      control: MoreInfo
                  card_mod:
                    style: |
                      ha-card {
                        background: var(--accent-color) !important;
                        --primary-text-color: white;
                        border-radius: 5px !important;
                      }
                - type: button
                  icon: mdi:chevron-right
                  show_name: false
                  show_state: false
                  tap_action:
                    action: perform-action
                    perform_action: script.universal_remote
                    data:
                      control: Right
                  card_mod:
                    style: |
                      ha-card {
                        background: rgba(255, 255, 255, 0.05) !important;
                        border-radius: 5px 20px 20px 5px !important;
                      }
                - type: custom:button-card
                  color_type: blank-card
                - type: button
                  icon: mdi:chevron-down
                  show_name: false
                  show_state: false
                  tap_action:
                    action: perform-action
                    perform_action: script.universal_remote
                    data:
                      control: Down
                  card_mod:
                    style: |
                      ha-card {
                        background: rgba(255, 255, 255, 0.05) !important;
                        border-radius: 5px 5px 20px 20px !important;
                      }
                - type: custom:button-card
                  color_type: blank-card
            - type: custom:button-card
              color_type: blank-card
              styles:
                card:
                  - height: 10px
            - type: grid
              columns: 3
              square: false
              cards:
                - type: button
                  icon: mdi:arrow-left
                  show_name: false
                  show_state: false
                  tap_action:
                    action: perform-action
                    perform_action: script.universal_remote
                    data:
                      control: Back
                - type: button
                  icon: mdi:home
                  show_name: false
                  show_state: false
                  tap_action:
                    action: perform-action
                    perform_action: script.universal_remote
                    data:
                      control: Home
                  double_tap_action:
                    action: perform-action
                    perform_action: script.universal_remote
                    data:
                      control: FullscreenToggle
                - type: button
                  icon: mdi:menu
                  show_name: false
                  show_state: false
                  tap_action:
                    action: perform-action
                    perform_action: script.universal_remote
                    data:
                      control: Menu
        - type: conditional
          conditions:
            - condition: or
              conditions:
                - entity: input_select.remote_control
                  state: Living TV
                - entity: input_select.remote_control
                  state: Kodi
          card:
            type: vertical-stack
            cards:
              - type: horizontal-stack
                cards:
                  - type: custom:bubble-card
                    card_type: select
                    entity: input_select.avr_inputs
                    show_state: true
                    show_icon: false
                  - type: custom:bubble-card
                    card_type: select
                    entity: input_select.tv_inputs
                    show_state: true
                    show_icon: false
        - type: conditional
          conditions:
            - entity: input_select.remote_control
              state: Kodi
          card:
            type: vertical-stack
            cards:
            - type: custom:vertical-stack-in-card
              card_mod:
                style: |
                  ha-card {
                    background-image: url('https://image.tmdb.org/t/p/w500{{ states('input_text.living_kodi_poster_path') }}') !important;
                    background-position: center !important;
                    background-size: cover !important;
                    border-radius: 8px !important;
                    border: 0px !important;
                  }
              cards:
                - type: custom:bubble-card
                  card_type: media-player
                  name: Kodi
                  entity: media_player.coreelec
                  card_layout: large
                  show_icon: false
                  rows: 2
                  cover_background: false
                  hide:
                    play_pause_button: true
                    volume_button: true
                    previous_button: true
                    next_button: true
                    power_button: true
                  styles: |
                    .bubble-title {
                      -webkit-text-stroke: 0.5px #000;
                      text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.5);
                    }
                    .bubble-container,
                    .bubble-background {
                      background: transparent !important;
                      background-color: transparent !important;
                      box-shadow: none !important;
                    }
                  sub_button:
                    main:
                      - type: custom:bubble-card
                        card_type: button
                        entity: media_player.avr
                        icon: mdi:volume-mute
                        tap_action:
                          action: perform-action
                          perform_action: script.mute_toggle
                          data:
                            source: media_player.avr
                      - type: custom:bubble-card
                        card_type: button
                        entity: media_player.avr
                        icon: mdi:volume-minus
                        tap_action:
                          action: perform-action
                          perform_action: media_player.volume_down
                          target:
                            entity_id: media_player.avr
                      - type: custom:bubble-card
                        card_type: button
                        button_type: slider
                        entity: media_player.avr
                        show_attribute: true
                        attribute: volume_level
                        tap_action: none
                      - type: custom:bubble-card
                        card_type: button
                        entity: media_player.avr
                        icon: mdi:volume-plus
                        tap_action:
                          action: perform-action
                          perform_action: media_player.volume_up
                          target:
                            entity_id: media_player.avr
                    bottom:
                      - icon: mdi:skip-backward
                        tap_action:
                          action: perform-action
                          perform_action: script.universal_remote
                          data:
                            control: SkipBackward
                      - icon: mdi:rewind
                        tap_action:
                          action: perform-action
                          perform_action: script.universal_remote
                          data:
                            control: Rewind
                      - icon: mdi:play-pause
                        tap_action:
                          action: perform-action
                          perform_action: script.universal_remote
                          data:
                            control: PlayPause
                      - icon: mdi:fast-forward
                        tap_action:
                          action: perform-action
                          perform_action: script.universal_remote
                          data:
                            control: FastForward
                      - icon: mdi:skip-forward
                        tap_action:
                          action: perform-action
                          perform_action: script.universal_remote
                          data:
                            control: SkipForward
                - type: custom:button-card
                  entity: media_player.coreelec
                  show_icon: false
                  show_name: false
                  show_state: false
                  custom_fields:
                    progress: |
                      [[[
                        const duration = Number(entity.attributes.media_duration) || 0;
                        const position = Number(entity.attributes.media_position) || 0;
                        const percentage = duration ? Math.min(100, (position / duration) * 100) : 0;
                        return `<div style="background: var(--primary-color); height: 100%; width: ${percentage}%; transition: width 0.5s linear;"></div>`;
                      ]]]
                  styles:
                    card:
                      - background: transparent
                      - border-radius: 0 0 8px 8px
                      - box-shadow: none
                      - height: 8px
                      - padding: 0
                      - overflow: hidden
                    grid:
                      - grid-template-areas: '"progress"'
                      - grid-template-columns: 100%
                      - grid-template-rows: 100%
                    custom_fields:
                      progress:
                        - background: rgba(255, 255, 255, 0.25)
                        - border-top: 1px solid rgb(0, 0, 0)
                        - border-radius: 0 0 8px 8px
                        - box-sizing: border-box
                        - height: 8px
                        - width: 100%
        - type: conditional
          conditions:
            - entity: input_select.remote_control
              state: Living TV
          card:
            type: vertical-stack
            cards:
              - type: custom:bubble-card
                card_type: media-player
                name: Living TV
                entity: media_player.living_tv_2
                card_layout: large
                show_icon: false
                rows: 1
                cover_background: true
                hide:
                  play_pause_button: true
                  volume_button: true
                  previous_button: true
                  next_button: true
                  power_button: true
                sub_button:
                  main:
                    - type: custom:bubble-card
                      card_type: button
                      entity: media_player.avr
                      icon: mdi:volume-mute
                      tap_action:
                        action: perform-action
                        perform_action: script.mute_toggle
                        data:
                          source: media_player.avr
                    - type: custom:bubble-card
                      card_type: button
                      entity: media_player.avr
                      icon: mdi:volume-minus
                      tap_action:
                        action: perform-action
                        perform_action: media_player.volume_down
                        target:
                          entity_id: media_player.avr
                    - type: custom:bubble-card
                      card_type: button
                      button_type: slider
                      entity: media_player.avr
                      show_attribute: true
                      attribute: volume_level
                      tap_action: none
                    - type: custom:bubble-card
                      card_type: button
                      entity: media_player.avr
                      icon: mdi:volume-plus
                      tap_action:
                        action: perform-action
                        perform_action: media_player.volume_up
                        target:
                          entity_id: media_player.avr
        - type: conditional
          conditions:
            - entity: input_select.remote_control
              state: Bedroom TV
          card:
            type: vertical-stack
            cards:
              - type: custom:bubble-card
                card_type: media-player
                name: Bedroom TV
                entity: media_player.tcl_tv
                card_layout: large
                show_icon: false
                rows: 2
                cover_background: true
                hide:
                  play_pause_button: true
                  volume_button: true
                  previous_button: true
                  next_button: true
                  power_button: true
                sub_button:
                  main:
                    - type: custom:bubble-card
                      card_type: button
                      entity: media_player.tcl_tv
                      icon: mdi:volume-mute
                      tap_action:
                        action: perform-action
                        perform_action: script.mute_toggle
                        data:
                          source: media_player.tcl_tv
                    - type: custom:bubble-card
                      card_type: button
                      entity: media_player.tcl_tv
                      icon: mdi:volume-minus
                      tap_action:
                        action: perform-action
                        perform_action: media_player.volume_down
                        target:
                          entity_id: media_player.tcl_tv
                    - type: custom:bubble-card
                      card_type: button
                      button_type: slider
                      entity: media_player.tcl_tv
                      show_attribute: true
                      attribute: volume_level
                      tap_action: none
                    - type: custom:bubble-card
                      card_type: button
                      entity: media_player.tcl_tv
                      icon: mdi:volume-plus
                      tap_action:
                        action: perform-action
                        perform_action: media_player.volume_up
                        target:
                          entity_id: media_player.tcl_tv
                  bottom:
                    - icon: mdi:skip-backward
                      tap_action:
                        action: perform-action
                        perform_action: script.universal_remote
                        data:
                          control: SkipBackward
                    - icon: mdi:rewind
                      tap_action:
                        action: perform-action
                        perform_action: script.universal_remote
                        data:
                          control: Rewind
                    - icon: mdi:play-pause
                      tap_action:
                        action: perform-action
                        perform_action: script.universal_remote
                        data:
                          control: PlayPause
                    - icon: mdi:fast-forward
                      tap_action:
                        action: perform-action
                        perform_action: script.universal_remote
                        data:
                          control: FastForward
                    - icon: mdi:skip-forward
                      tap_action:
                        action: perform-action
                        perform_action: script.universal_remote
                        data:
                          control: SkipForward
    - type: conditional
      conditions:
      - entity: input_select.remote_control
        state: "Spotify"
      card:
        type: custom:vertical-stack-in-card
        cards:
        - type: custom:bubble-card
          card_type: select
          entity: input_select.spotify_users
          show_state: true
          show_icon: false
          card_mod:
            style: |
              .bubble-select-card-container {
                border: none !important;
                border-radius: 0px !important;
              }
        - type: custom:config-template-card
          entities:
            - input_select.spotify_users # The trigger for re-rendering
            - input_boolean.spotify_selector_visible # Trigger for showing/hiding the library
            - media_player.spotifyplus_albibig # The entity for the card to display
          variables:
            # This converts "Albibig" to "albibig" to match your entity names
            USER: states['input_select.spotify_users'].state.toLowerCase()
            VISIBLE: states['input_boolean.spotify_selector_visible'].state
          card_mod:
            style: |
              ha-card {
                border: none !important;
              }
          card:
            type: custom:spotifyplus-card
            cardUniqueId: 96eb11ef-a2e3-4e20-91b4-652e08ad8a62
            sections:
              - player
            entity: ${"media_player.spotifyplus_" + USER}
            playerHeaderTitle: "{player.source}"
            playerHeaderArtistTrack: "{player.media_artist} - {player.media_title}"
            playerHeaderAlbum: "{player.media_album_name} {player.sp_playlist_name_title}"
            playerHeaderNoMediaPlayingText: "\"{player.name}\" state is \"{player.state}\""
            playerVolumeControlsShowPlusMinus: true
            playerVolumeStepValue: 5
            width: fill
            height: "${VISIBLE === 'on' ? 20 : 30}"
            card_mod:
              style: |
                ha-card {
                  border: none !important;
                  border-radius: 0px, 5px, 5px, 0px !important;
                }
        - type: custom:bubble-card
          card_type: button
          name: Library
          entity: input_boolean.spotify_selector_visible
          tap_action:
            action: toggle
          styles: |
            .bubble-icon {
              ${icon.setAttribute("icon", hass.states['input_boolean.spotify_selector_visible'].state === 'off' ? 'mdi:chevron-right' : 'mdi:chevron-down')}
            }
            .bubble-button-container {
              background-color: transparent !important;
            }
            .bubble-button-background {
              background-color: transparent !important;
            }
        - type: conditional
          conditions:
            - entity: input_boolean.spotify_selector_visible
              state: 'on'
          card:
            type: custom:config-template-card
            entities:
              - input_select.spotify_users # The trigger for re-rendering
            variables:
              # This converts "Albibig" to "albibig" to match your entity names
              USER: states['input_select.spotify_users'].state.toLowerCase()
            card:
              type: custom:spotifyplus-card
              cardUniqueId: 96eb11ef-a2e3-4e20-91b4-652e08ad8a62
              sections:
                - devices
                - searchmedia
                - playlistfavorites
                - recents
                - trackfavorites
              entity: ${"media_player.spotifyplus_" + USER}
              deviceBrowserTitle: Spotify Connect Devices ({medialist.filteritemcount} items)
              deviceBrowserSubTitle: click an item to select the device; click-hold for device info
              deviceBrowserItemsPerRow: 1
              deviceBrowserItemsHideTitle: false
              deviceBrowserItemsHideSubTitle: true
              playlistFavBrowserTitle: >-
                Playlist Favorites for {player.sp_user_display_name} ({medialist.filteritemcount} items)
              playlistFavBrowserSubTitle: click a tile item to play the content; click-hold for actions
              playlistFavBrowserItemsPerRow: 4
              playlistFavBrowserItemsHideTitle: false
              playlistFavBrowserItemsHideSubTitle: false
              playlistFavBrowserItemsSortTitle: true
              recentBrowserTitle: >-
                Recently Played by {player.sp_user_display_name} ({medialist.filteritemcount} items)
              recentBrowserSubTitle: click a tile item to play the content; click-hold for actions
              recentBrowserItemsPerRow: 4
              recentBrowserItemsHideTitle: false
              recentBrowserItemsHideSubTitle: true
              trackFavBrowserTitle: >-
                Track Favorites for {player.sp_user_display_name} ({medialist.filteritemcount} items)
              trackFavBrowserSubTitle: click a tile item to play the content; click-hold for actions
              trackFavBrowserItemsPerRow: 1
              trackFavBrowserItemsHideTitle: false
              trackFavBrowserItemsHideSubTitle: true
              trackFavBrowserItemsSortTitle: false
              searchMediaBrowserTitle: >-
                Search Media for {player.sp_user_display_name} ({medialist.filteritemcount} items)
              searchMediaBrowserSubTitle: click a tile item to play the content; click-hold for actions
              searchMediaBrowserUseDisplaySettings: true
              searchMediaBrowserItemsPerRow: 1
              searchMediaBrowserItemsHideTitle: false
              searchMediaBrowserItemsHideSubTitle: true
              searchMediaBrowserItemsSortTitle: false
              searchMediaBrowserSearchLimit: 50
              searchMediaBrowserSearchTypes:
                - Albums
                - Artists
                - Playlists
                - Tracks
                - AudioBooks
                - Shows
                - Episodes
              searchMediaBrowserQueueSelection: true
              customImageUrls:
                X_default: /local/images/spotifyplus_card_customimages/default.png
                X_empty preset: /local/images/spotifyplus_card_customimages/empty_preset.png
                X_Daily Mix 1: https://brands.home-assistant.io/spotifyplus/icon.png
                X_playerBackground: /local/images/spotifyplus_card_customimages/playerBackground.png
                X_playerIdleBackground: /local/images/spotifyplus_card_customimages/playerIdleBackground.png
                X_playerOffBackground: /local/images/spotifyplus_card_customimages/playerOffBackground.png
              width: fill
              height: 40
              card_mod:
                style: |
                  ha-card {
                    border: none !important;
                  }
    - type: custom:button-card
      color_type: blank-card
      styles:
        card:
          - height: 100px
