            min: 0
            max: "${parseFloat(states['input_number.power_total_current_max'].state)}"
            segments:
              - from: 0
                color: green
              - from: "${parseFloat(states['sensor.power_total_current_avg'].state) - (parseFloat(states['input_number.power_total_current_max'].state) / 100)}"
                color: black
              - from: "${parseFloat(states['sensor.power_total_current_avg'].state) + (parseFloat(states['input_number.power_total_current_max'].state) / 100)}"
                color: yellow
              # Red starts at Mean + 2 * Combined Standard Deviation
              - from: >-
                  ${
                    const getVal = (entity) => {
                      const val = parseFloat(states[entity]?.state);
                      return isNaN(val) ? 0 : val;
                    };

                    const avg = getVal('sensor.power_total_current_avg');
                    
                    const sumSquares = 
                      Math.pow(getVal('sensor.power_tv_stand_left_st_dev'), 2) +
                      Math.pow(getVal('sensor.power_tv_stand_right_st_dev'), 2) +
                      Math.pow(getVal('sensor.power_wine_fridge_st_dev'), 2) +
                      Math.pow(getVal('sensor.power_refrigerator_st_dev'), 2) +
                      Math.pow(getVal('sensor.power_terrarium_st_dev'), 2) +
                      Math.pow(getVal('sensor.power_dumbo_st_dev'), 2) +
                      Math.pow(getVal('sensor.power_dehumidifier_st_dev'), 2) +
                      Math.pow(getVal('sensor.power_box_fan_st_dev'), 2) +
                      Math.pow(getVal('sensor.power_computer_desk_st_dev'), 2) +
                      Math.pow(getVal('sensor.power_coffee_stand_st_dev'), 2);

                    avg + (2 * Math.sqrt(sumSquares))
                  }
                color: red
