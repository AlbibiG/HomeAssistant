button_card_templates:
  nav_button_style:
    color_type: icon
    styles:
      card:
        - background: none
        - border: none
        - box-shadow: none
        - height: 60px
      icon:
        - width: 24px
        - color: |
            [[[
              if (window.location.pathname.includes(variables.path)) return 'rgba(255, 165, 0, 1)';
              return 'rgba(150, 150, 150, 1)';
            ]]]
      name:
        - font-size: 10px
        - font-weight: bold
        - color: |
            [[[
              if (window.location.pathname.includes(variables.path)) return 'white';
              return 'grey';
            ]]]

anchors:
  - nav_bar: &navbar_anchor
    - type: custom:mod-card
      card_mod:
        style: |
          ha-card {
            position: fixed !important;
            bottom: 25px !important;
            left: 5% !important;
            width: 90% !important;
            height: 70px !important;
            background: transparent !important; /* Make main card transparent */
            z-index: 1000 !important;
            display: block !important;
            margin: 0 !important;
            border: none !important; /* Remove border from here */
            box-shadow: none !important; /* Remove shadow from here */
          }
          /* This creates the actual visible bar */
          ha-card::before {
            content: "";
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(25, 25, 25, 0.5) !important;
            backdrop-filter: blur(15px) !important;
            border-radius: 40px !important;
            border: 1px solid rgba(255, 255, 255, 0.15) !important;
            box-shadow: 0px 10px 30px rgba(0,0,0,0.6) !important;
            
            /* The Mask only applies to this background layer */
            -webkit-mask-image: radial-gradient(circle at 50% 50%, transparent 44px, black 45px);
            z-index: -1;
          }
      card:
        type: horizontal-stack
        cards:
          - type: custom:button-card
            template: nav_button_style
            icon: mdi:lightbulb
            name: Lights
            variables:
              path: lights
            tap_action:
              action: navigate
              navigation_path: lights
          - type: custom:button-card
            template: nav_button_style
            icon: mdi:cloud
            name: Climate
            variables:
              path: climate
            tap_action:
              action: navigate
              navigation_path: climate
          - type: custom:button-card
            template: nav_button_style
            icon: mdi:home
            variables:
              path: home
            tap_action:
              action: navigate
              navigation_path: home
            styles:
              card:
                - border: 1px solid !important;
                - border-color: rgba(255,255,255,.15) !important;
                - background: rgba(25,25,25,.5) !important;
                - border-radius: 50% !important;
                - width: 80px !important;
                - height: 80px !important;
                - margin-top: -6.25% !important;
                - backdrop-filter: blur(15px) !important;
              icon:
                - width: 40px
              grid:
                - position: relative
          - type: custom:button-card
            template: nav_button_style
            icon: mdi:robot-vacuum
            name: Rocky
            variables:
              path: rocky
            tap_action:
              action: navigate
              navigation_path: rocky
          - type: custom:button-card
            template: nav_button_style
            icon: mdi:remote
            name: Remote
            variables:
              path: remote
            tap_action:
              action: navigate
              navigation_path: remote
  - return_button: &return_home_anchor
      type: custom:mod-card
      card_mod:
        style: |
          ha-card {
            position: fixed !important;
            bottom: 20px !important;
            left: 50% !important;
            /* This shifts the card back by half its own width to truly center it */
            transform: translateX(-50%) !important; 
            
            /* For a perfect circle, width and height must be equal pixels */
            width: 80px !important;
            height: 80px !important;
            border-radius: 50% !important; /* 50% creates a circle */
            
            background: rgba(25, 25, 25, 0.5) !important;
            backdrop-filter: blur(15px) !important;
            z-index: 1000 !important;
            border: 1px solid rgba(255, 255, 255, 0.15) !important;
            box-shadow: 0px 10px 30px rgba(0,0,0,0.6) !important;
            display: flex !important;
            align-items: center !important;
            justify-content: center !important;
          }
      card:
        type: custom:button-card
        template: nav_button_style
        icon: mdi:home
        variables:
          path: home
        tap_action:
          action: navigate
          navigation_path: home
        styles:
          card:
            - width: 80px !important;
            - height: 80px !important;
            - background: transparent !important;
            - border-radius: 50% !important;
            - box-shadow: none !important;
          icon:
            - width: 40px

kiosk_mode:
  hide_header: true
  hide_sidebar: '[[[ !user_is_admin ]]]'
views:
  - title: Home
    path: home
    cards:
    - <<: *navbar_anchor
    - type: custom:mushroom-chips-card
      alignment: center
      card_mod:
        style: |
          ha-card {
            --chip-box-shadow: none;
            --chip-background: rgba(255, 255, 255, 0.05);
            --chip-spacing: 8px;
            padding: 0px;
            border: none;
          }
      chips:
        - type: template
          icon: mdi:battery-alert-variant-outline
          icon_color: red
          content: Low Battery
          tap_action:
            action: more-info
            entity: sensor.all_batteries
          card_mod:
            style: |
              :host {
                {% set b1 = expand('sensor.all_batteries') | selectattr('state', 'lt', '10') | list | count %}
                {% if b1 > 0 %}
                  display: inline-block !important;
                  --chip-background: rgba(255, 0, 0, 0.15);
                  border: none;
                {% else %}
                  display: none !important;
                {% endif %}
              }
    - type: custom:button-card
      name: |
        [[[
          var hour = new Date().getHours();
          if (hour < 12) return 'Good Morning';
          if (hour < 18) return 'Good Afternoon';
          return 'Good Evening';
        ]]]
      label: Welcome to your smart home
      show_label: true
      styles:
        card:
          - background: none
          - border: none
          - box-shadow: none
          - padding: 0px 0px 0px 5%
          - text-align: left
        name:
          - justify-self: start
          - font-size: 28px
          - font-weight: 700
          - color: white
        label:
          - justify-self: start
          - font-size: 14px
          - color: rgba(255, 255, 255, 0.5)
    - type: custom:bubble-card
      card_type: separator
      name: Room Controls
      icon: mdi:home
      styles: |
        .bubble-line { 
          background-color: grey !important; 
          height: 5px !important; 
        } 
    - type: custom:mod-card
      card_mod:
        style: |
          ha-card {
            padding: 10px;
            background: rgba(96,107,153,0.75);
          }
      card:
        type: custom:layout-card
        layout_type: custom:grid-layout
        layout:
          grid-template-columns: 1fr 2fr
          grid-gap: 4px
          margin: 0px
        cards:
          - type: custom:bubble-card
            card_type: button
            button_type: name
            name: Living Room
            icon: mdi:sofa
            styles: |
              .bubble-button-container {
                background: none;
                height: 110px;
              } .bubble-button {
                flex-direction: column !important; 
                justify-content: center !important;
                align-items: center !important;
              } .bubble-icon-container {
                margin-top: 10px;
                width: 60px;
                height: 60px;
                background: none;
              } .bubble-icon {
                --mdc-icon-size: 45px !important;
              } .bubble-name, .bubble-name-container {
                justify-content: center !important;
                text-align: center !important;
                margin: 0px;
                padding: 0px;
                font-size: 16px;
              }
          - type: custom:vertical-stack-in-card
            card_mod:
              style: |
                ha-card {
                  background: none;
                  border: none;
                }
            cards:
              - type: custom:vertical-stack-in-card
                card_mod:
                  style: |
                    ha-card {
                      background: none;
                      border: none;
                    }
                cards:
                  - type: custom:bubble-card
                    card_type: sub-buttons
                    button_type: switch
                    styles: >
                      .bubble-sub-buttons-container {
                        background: none;
                        margin-top: -20px;
                      } .bubble-sub-button {
                        height: auto !important;
                        width: auto !important;
                        background: none;
                      }  .bubble-sub-button ha-icon {
                        --mdc-icon-size: 25px !important;
                      } .bubble-sub-button:nth-child(1)
                      .bubble-sub-button-icon {
                        color: ${
                          (() => {
                            const state = hass.states['sensor.thermometer_living_temperature']?.state;
                            
                            if (!state || state === 'unknown' || state === 'unavailable') {
                              return '#9c9fa1';
                            }

                            const temp = parseFloat(state);

                            if (temp > 80) {
                              return 'yellow';
                            } else if (temp < 60) {
                              return 'blue';
                            } else {
                              return 'green';
                            }
                          })()
                        } !important;
                      } .bubble-sub-button:nth-child(2)
                      .bubble-sub-button-icon {
                        color: ${
                          (() => {
                            const current_h = parseFloat(hass.states['sensor.thermometer_living_humidity']?.state);
                            const max_h = parseFloat(hass.states['input_number.humidity_maximum']?.state);
                            const min_h = parseFloat(hass.states['input_number.humidity_minimum']?.state);

                            // Safety check for invalid data
                            if (isNaN(current_h) || isNaN(max_h) || isNaN(min_h)) {
                              return '#9c9fa1';
                            }

                            // Logic: Yellow if out of bounds, Green if within range
                            if (current_h > max_h || current_h < min_h) {
                              return 'yellow';
                            } else {
                              return 'green';
                            }
                          })()
                        } !important;
                      } .bubble-sub-button:nth-child(3)
                      .bubble-sub-button-icon {
                        color: yellow !important;
                      }
                    sub_button:
                      bottom:
                        - entity: sensor.thermometer_living_temperature
                          show_state: false
                          show_background: false
                          show_icon: true
                        - entity: sensor.thermometer_living_humidity
                          show_state: false
                          show_background: false
                          show_icon: true
                        - entity: sensor.power_total_current
                          show_state: false
                          show_background: false
                          show_icon: true
                  - type: custom:bubble-card
                    card_type: sub-buttons
                    button_type: switch
                    styles: |
                      .bubble-sub-buttons-container {
                        background: none;
                        margin-top: -20px;
                        margin-bottom: -10px;
                      }
                    sub_button:
                      bottom:
                        - entity: sensor.thermometer_living_temperature
                          show_state: true
                          show_background: false
                          show_icon: false
                        - entity: sensor.thermometer_living_humidity
                          show_state: true
                          show_background: false
                          show_icon: false
                        - entity: sensor.power_total_current
                          show_state: true
                          show_background: false
                          show_icon: false
              - type: custom:bubble-card
                card_type: sub-buttons
                button_type: switch
                styles: |
                  .bubble-sub-buttons-container {
                    background: none;
                    justify-content: space-between !important;
                  } .bubble-sub-button {
                    #right: 20%;
                    background: black;
                    border: solid 1px;
                    border-radius: 50% !important;
                    max-width: 40px !important;
                    transform: scale(1.2);
                    margin: 0px 10px;
                  } 
                  .bubble-line {
                    background: black;
                    opacity: 1;
                  }
                  .bubble-sub-button:nth-child(1) .bubble-sub-button-icon {
                    color: ${
                      (() => {
                        const state = hass.states['light.hue_and_other']?.state;
                        const colors = {
                          'on': 'yellow',
                          'off': 'grey'
                        };
                        return colors[state] || '#9c9fa1';
                      })()
                    } !important;
                  } 
                  .bubble-sub-button:nth-child(2) .bubble-sub-button-icon {
                    color: ${
                      (() => {
                        const queue_state = hass.states['input_text.rocky_queue']?.state;
                        const my_room_ids = ['1', '99']; 

                        if (!queue_state || ['','unknown','unavailable'].includes(queue_state)) {
                          return '#9c9fa1';
                        }

                        const queue_array = queue_state.split(';');
                        
                        const ids_in_queue = queue_array.map(run => run.split(',')[0]);

                        const current_run_id = ids_in_queue[0];

                        if (my_room_ids.includes(current_run_id)) {
                          return 'green'; // One of my rooms is currently cleaning
                        }

                        const is_queued = my_room_ids.some(id => ids_in_queue.includes(id));
                        if (is_queued) {
                          return 'yellow'; // One of my rooms is waiting in the queue
                        }

                        return '#9c9fa1'; // None of my rooms are active or queued
                      })()
                    } !important;
                  }
                  .bubble-sub-button:nth-child(3) .bubble-sub-button-icon {
                    color: ${
                      (() => {
                        const state = hass.states['switch.box_fan_with_filter']?.state;
                        const colors = {
                          'on': 'dodgerblue',
                          'off': 'grey'
                        };
                        return colors[state] || '#9c9fa1';
                      })()
                    } !important;
                  } 
                sub_button:
                  bottom:
                    - group:
                        - entity: light.hue_and_other
                          show_background: false
                          show_icon: true
                          show_state: false
                          tap_action:
                            action: toggle
                        - icon: mdi:robot-vacuum
                          tap_action:
                            confirmation:
                              title: Clean Living Room
                              text: >-
                                Are you sure you want to clean the living
                                room?
                              confirm_text: Yes, clean
                              dismiss_text: No, cancel
                            action: call-service
                            service: script.rocky_add_to_queue
                            service_data:
                              room_id: 1
                        - entity: switch.box_fan_with_filter
                          show_background: false
                          show_icon: true
                          icon: mdi:air-filter
                          show_state: false
                          tap_action:
                            action: toggle
                      justify_content: center
