                  color: green
                - from: "${parseFloat(states['sensor.power_tv_stand_right_avg'].state) - parseFloat(states['input_number.power_tv_stand_right_max'].state) / 100 }"
                  color: black
                - from: "${parseFloat(states['sensor.power_tv_stand_right_avg'].state) + parseFloat(states['input_number.power_tv_stand_right_max'].state) / 100 }"
                  color: yellow
