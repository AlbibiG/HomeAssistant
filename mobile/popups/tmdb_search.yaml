type: custom:bubble-card
card_type: pop-up
hash: '#tmdb_search_popup'
name: "Search TMDb"
popup_style: classic
icon: mdi:magnify
bg_blur: true
cards:
  - type: vertical-stack
    cards:
      - type: custom:layout-card
        layout_type: grid
        layout:
          grid-template-columns: 9fr 1fr
          grid-template-areas: "'input button'"
          margin: 0px 0px 0px -50px
          padding: 0px
          border-radius: 12px
          align-items: left
        style: |
          ha-card {
            background: rgba(255, 255, 255, 0.1) !important;
            border: none !important;
            box-shadow: none !important;
          }
        cards:
          - type: entities
            view_layout:
              grid-area: input
            card_mod:
              style: |
                ha-card {
                  background: none !important;
                  border: none !important;
                  box-shadow: none !important;
                }
            entities:
              - entity: input_text.tmdb_search
                name: false
                icon: None
          - type: custom:bubble-card
            card_type: button
            name: Search
            entity: input_text.tmdb_search
            icon: mdi:magnify
            tap_action:
              action: navigate
              navigation_path: media_search_results
            view_layout:
              grid-area: button
            styles: |
              .bubble-button-card-container {
                background: none !important;
                padding: 0 !important;
                margin: 20px 0 0 -10px !important;
              }
              .bubble-icon-container {
                border-radius: 50% !important;
              }
              .bubble-name, .bubble-state {
                display: none !important;
              }
              .bubble-icon {
                --mdc-icon-size: 32px !important;
              }
  - type: custom:auto-entities
    card:
      type: grid
      columns: 1
      square: false
    card_param: cards
    filter:
      template: >
        {% set history = state_attr('sensor.tmdb_search_history', 'history') or [] %}
        {% set ns = namespace(cards=[]) %}
        
        {% for term in history %}
          {% set card = {
            'type': 'custom:button-card',
            'name': term,
            'icon': 'mdi:history',
            'tap_action': {
              'action': 'call-service',
              'service': 'input_text.set_value',
              'target': {
                'entity_id': 'input_text.tmdb_search'
              },
              'data': {
                'value': term
              }
            },
            'styles': {
              'card': [
                {'padding': '8px 12px'},
                {'background-color': 'transparent'},
                {'box-shadow': 'none'},
                {'border': 'none'},
                {'cursor': 'pointer'}
              ],
              'grid': [
                {'grid-template-areas': '"i name"'},
                {'grid-template-columns': '40px 1fr'},
                {'grid-column-gap': '8px'},
                {'align-items': 'center'}
              ],
              'name': [
                {'font-weight': '500'}
              ]
            }
          } %}
          {% set ns.cards = ns.cards + [card] %}
        {% endfor %}

        {% set blank_card = {
          'type': 'custom:button-card',
          'color_type': 'blank-card',
          'styles': {
            'card': [
              {'height': '25px'}
            ]
          }
        } %}

        {% set ns.cards = ns.cards + [blank_card] %}
        {{ ns.cards }}