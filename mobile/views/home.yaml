          card_mod:
            style: |
              ha-card {
                background: none;
                border: none;
              }
          cards:
            - type: custom:vertical-stack-in-card
              card_mod:
                style: |
                  ha-card {
                    background: none;
                    border: none;
                  }
              cards:
                - type: custom:bubble-card
                  card_type: sub-buttons
                  button_type: switch
                  sub_button_alignment: right
                  styles: >
                    .bubble-sub-buttons-container {
                      background: none;
                      margin-top: -20px;
                    } .bubble-sub-button {
                      height: auto !important;
                      width: auto !important;
                      background: none;
                    } .bubble-sub-button ha-icon {
                      --mdc-icon-size: 25px !important;
                    } .bubble-sub-button:nth-child(1)
                    .bubble-sub-button-icon {
                      color: ${
                        (() => {
                          const state = hass.states['sensor.thermometer_bathroom_temperature']?.state;
                          
                          if (!state || state === 'unknown' || state === 'unavailable') {
                            return '#9c9fa1';
                          }

                          const temp = parseFloat(state);

                          if (temp > 80) {
                            return 'yellow';
                          } else if (temp < 60) {
                            return 'blue';
                          } else {
                            return 'green';
                          }
                        })()
                      } !important;
                    } .bubble-sub-button:nth-child(2)
                    .bubble-sub-button-icon {
                      color: ${
                        (() => {
                          const current_h = parseFloat(hass.states['sensor.thermometer_bathroom_humidity']?.state);
                          const max_h = parseFloat(hass.states['input_number.humidity_maximum']?.state);
                          const min_h = parseFloat(hass.states['input_number.humidity_minimum']?.state);

                          // Safety check for invalid data
                          if (isNaN(current_h) || isNaN(max_h) || isNaN(min_h)) {
                            return '#9c9fa1';
                          }

                          // Logic: Yellow if out of bounds, Green if within range
                          if (current_h > max_h || current_h < min_h) {
                            return 'yellow';
                          } else {
                            return 'green';
                          }
                        })()
                      } !important;
                    } .bubble-sub-button:nth-child(3)
                    .bubble-sub-button-icon {
                      color: yellow !important;
                    }
                  sub_button:
                    bottom:
                      - entity: sensor.thermometer_bathroom_temperature
                        show_state: false
                        show_background: false
                        show_icon: true
                      - entity: sensor.thermometer_bathroom_humidity
                        show_state: false
                        show_background: false
                        show_icon: true
                      - entity: sensor.power_total_current
                        show_state: false
                        show_background: false
                        show_icon: true
                - type: custom:bubble-card
                  card_type: sub-buttons
                  button_type: switch
                  sub_button_alignment: right
                  styles: |
                    .bubble-sub-buttons-container {
                      background: none;
                      margin-top: -20px;
                      margin-bottom: -10px;
                    }
                  sub_button:
                    bottom:
                      - entity: sensor.thermometer_bathroom_temperature
                        show_state: true
                        show_background: false
                        show_icon: false
                      - entity: sensor.thermometer_bathroom_humidity
                        show_state: true
                        show_background: false
                        show_icon: false
                      - entity: sensor.power_total_current
                        show_state: true
                        show_background: false
                        show_icon: false
            - type: custom:bubble-card
              card_type: sub-buttons
              button_type: switch
              styles: |
                .bubble-sub-buttons-container {
                  background: none;
                }
                .bubble-sub-button {
                  background: black;
                  border: solid 1px;
                  border-radius: 50% !important;
                  max-width: 40px !important;
                  transform: scale(1.2);
                } 
                .bubble-sub-button:nth-child(1) .bubble-sub-button-icon {
                  color: ${
                    (() => {
                      const queue_state = hass.states['input_text.rocky_queue']?.state;
                      const my_room_ids = ['3', '99']; 

                      if (!queue_state || ['','unknown','unavailable'].includes(queue_state)) {
                        return '#9c9fa1';
                      }

                      const queue_array = queue_state.split(';');
                      
                      const ids_in_queue = queue_array.map(run => run.split(',')[0]);

                      const current_run_id = ids_in_queue[0];

                      if (my_room_ids.includes(current_run_id)) {
                        return 'green'; // One of my rooms is currently cleaning
                      }

                      const is_queued = my_room_ids.some(id => ids_in_queue.includes(id));
                      if (is_queued) {
                        return 'yellow'; // One of my rooms is waiting in the queue
                      }

                      return '#9c9fa1'; // None of my rooms are active or queued
                    })()
                  } !important;
                }
              sub_button:
                bottom:
                  - group:
                      - icon: mdi:robot-vacuum
                        tap_action:
                          confirmation:
                            title: Clean Bathroom
                            text: Are you sure you want to clean the bathroom?
                            confirm_text: Yes, clean
                            dismiss_text: No, cancel
                          action: call-service
                          service: script.rocky_add_to_queue
                          service_data:
                            room_id: 3
                    justify_content: center
