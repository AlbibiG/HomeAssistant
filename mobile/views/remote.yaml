title: Remote
path: remote
cards:
  - !include ../media_navbar.yaml
  - type: vertical-stack
    cards:
    - type: custom:button-card
      name: Remote
      styles:
        card:
          - background: none
          - border: none
          - box-shadow: none
          - padding: 0px 0px 0px 5%
          - text-align: left
        name:
          - justify-self: start
          - font-size: 28px
          - font-weight: 700
          - color: white
        label:
          - justify-self: start
          - font-size: 14px
          - color: rgba(255, 255, 255, 0.5)
    - type: custom:bubble-card
      card_type: separator
      name: Device
      icon: mdi:remote
      sub_button:
        - entity: input_select.remote_control
          show_state: true
          show_background: false
          show_icon: false
    - type: conditional
      conditions:
        - entity: input_select.remote_control
          state: "Kodi"
      card: !include remotes/kodi.yaml
    - type: conditional
      conditions:
        - entity: input_select.remote_control
          state: "Living TV"
      card: !include remotes/living_room.yaml
    - type: conditional
      conditions:
        - entity: input_select.remote_control
          state: "Bedroom TV"
      card: !include remotes/bedroom_tv.yaml
    - type: conditional
      conditions:
        - entity: input_select.remote_control
          state: "Spotify"
      card: !include remotes/spotify.yaml
    - type: custom:button-card
      color_type: blank-card
      styles:
        card:
          - height: 100px
