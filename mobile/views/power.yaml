title: Power
path: power
cards:
  - !include ../return_button.yaml
  - type: vertical-stack
    cards:
    - type: custom:button-card
      name: Power Usage
      styles:
        card:
          - background: none
          - border: none
          - box-shadow: none
          - padding: 0px 0px 0px 5%
          - text-align: left
        name:
          - justify-self: start
          - font-size: 28px
          - font-weight: 700
          - color: white
        label:
          - justify-self: start
          - font-size: 14px
          - color: rgba(255, 255, 255, 0.5)
    - type: custom:mushroom-chips-card
      alignment: center
      chips:
      - type: template
        icon: mdi:lightning-bolt
        content: >-
          Today | {{ (states('sensor.power_total_daily') | float(0)) | round(1) }} kWh
        icon_color: yellow
      - type: template
        icon: mdi:lightning-bolt
        content: >-
          This Month | {{ (states('sensor.power_total_monthly') | float(0)) | round(1) }} kWh
        icon_color: yellow
      
    - type: vertical-stack
      cards:
      - type: custom:bubble-card
        card_type: separator
        name: Current Power Usage
        icon: mdi:home-lightning-bolt
        styles: |
          .bubble-line { 
            background-color: grey !important; 
            height: 5px !important; 
          }
      - type: custom:power-flow-card-plus
        entities:
          home:
            entity: sensor.power_total_current
            color_icon: solar
          fossil_fuel_percentage:
            entity: sensor.electricity_maps_grid_fossil_fuel_percentage
            icon: mdi:leaf
            color_icon: true
            display_zero: true
            name: Low Carbon
            state_type: power
          grid:
            icon: mdi:transmission-tower
            name: PSEG
            entity: sensor.power_total_current
            display_state: one_way
        watt_threshold: 10000
      - type: grid
        cards:
          - type: custom:mini-graph-card
            entities:
              - entity: sensor.living_room_server_current_consumption
                name: Server
            name: Server
            icon: mdi:server
            show:
              icon: true
              name: true
              state: true
              graph: line
              fill: fade
              points: false
            color_thresholds:
              - value: 0
                color: '#3498db'
            hours_to_show: 24
            points_per_hour: 20

          - type: custom:mini-graph-card
            entities:
              - entity: sensor.living_room_ethernet_switch_current_consumption
                name: Ethernet Switch
            name: Ethernet Switch
            icon: mdi:switch
            show:
