title: Bathroom Scale
path: scale
cards:
  - !include ../return_button.yaml
  - type: vertical-stack
    cards:
    - type: custom:button-card
      name: Bathroom Scale
      styles:
        card:
          - background: none
          - border: none
          - box-shadow: none
          - padding: 0px 0px 0px 5%
          - text-align: left
        name:
          - justify-self: start
          - font-size: 28px
          - font-weight: 700
          - color: white
        label:
          - justify-self: start
          - font-size: 14px
          - color: rgba(255, 255, 255, 0.5)
    - type: custom:bubble-card
      card_type: separator
      name: User Selection
      icon: mdi:account
      styles: |
        .bubble-line { 
          background-color: grey !important; 
          height: 5px !important; 
        }
      sub_button:
        - entity: input_select.scale_users
          show_state: true
          show_background: false
          show_icon: false
    - type: custom:config-template-card
      entities:
        - input_select.scale_users
      variables:
        USER: states['input_select.scale_users'].state.toLowerCase()
      card:
        type: custom:mushroom-chips-card
        alignment: center
        chips:
          - type: template
            tap_action:
              action: none
            # We use the weight sensor here to track the timestamp
            content: >
              {% set u = states('input_select.scale_users') | lower %}
              {% set entity_id = 'sensor.smart_scale_' ~ u ~ '_s_weight' %}
              {% if states[entity_id] %}
                Last weighed: {{ relative_time(states[entity_id].last_changed) }} ago
              {% else %}
                No data
              {% endif %}
            icon: mdi:clock-outline
          - type: template
            tap_action:
              action: none
            content: >
              {% set u = states('input_select.scale_users') | lower %}
              {% set entity_id = 'sensor.smart_scale_' ~ u ~ '_s_weight' %}
              {% if states[entity_id] %}
                {{ states(entity_id) | round(1) }} lbs
              {% else %}
                No data
              {% endif %}
            icon: mdi:weight-pound
          - type: template
            tap_action:
              action: none
            content: >
              {% set u = states('input_select.scale_users') | lower %}
              {% set entity_id = 'sensor.smart_scale_' ~ u ~ '_s_body_fat_percentage' %}
              {% if states[entity_id] %}
                {{ states(entity_id) }} %
              {% else %}
                No data
              {% endif %}
            icon: mdi:percent
    - type: custom:config-template-card
      entities:
        - input_select.scale_users
      variables:
        USER: states['input_select.scale_users'].state.toLowerCase()
      card:
        type: vertical-stack
        cards:
          - type: custom:vertical-stack-in-card
            cards:
          # --- Weight Chart ---
            - type: markdown
              content: "## Weight"
              card_mod:
                style: |
                  ha-card {
                    border: none !important;
                  }
            - type: statistics-graph
              entities:
                - entity: ${"sensor.smart_scale_" + USER + "_s_weight"}
                  name: Weight
              stat_types:
                - mean
              days_to_show: 30
              chart_type: line
              hide_legend: true
              tap_action:
                action: none
              card_mod:
                style: |
                  ha-card {
                    border: none !important;
                  }

          # --- Body Fat Chart ---
          - type: custom:vertical-stack-in-card
            cards:
          # --- Weight Chart ---
            - type: markdown
              content: "## Body Fat %"
              card_mod:
                style: |
                  ha-card {
                    border: none !important;
                  }
            - type: statistics-graph
              entities:
                - entity: ${"sensor.smart_scale_" + USER + "_s_body_fat_percentage"}
                  name: Body Fat
              stat_types:
                - mean
              days_to_show: 30
              chart_type: line
              hide_legend: true
              tap_action:
                action: none
              card_mod:
                style: |
                  ha-card {
                    border: none !important;
                  }
          - type: custom:vertical-stack-in-card
            cards:
          # --- Weight Chart ---
            - type: markdown
              content: "## BMI"
              card_mod:
                style: |
                  ha-card {
                    border: none !important;
                  }
            - type: statistics-graph
              entities:
                - entity: ${"sensor.smart_scale_" + USER + "_s_body_mass_index"}
                  name: BMI
              stat_types:
                - mean
              days_to_show: 30
              chart_type: line
              hide_legend: true
              tap_action:
                action: none
              card_mod:
                style: |
                  ha-card {
                    border: none !important;
                  }

    - type: custom:button-card
      color_type: blank-card
      styles:
        card:
          - height: 100px
