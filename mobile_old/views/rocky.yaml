title: Rocky
path: rocky
cards:
  - !include ../navbar.yaml
  - type: vertical-stack
    cards:
    - type: custom:button-card
      name: Rocky
      styles:
        card:
          - background: none
          - border: none
          - box-shadow: none
          - padding: 0px 0px 0px 5%
          - text-align: left
        name:
          - justify-self: start
          - font-size: 28px
          - font-weight: 700
          - color: white
        label:
          - justify-self: start
          - font-size: 14px
          - color: rgba(255, 255, 255, 0.5)
    - type: custom:bubble-card
      card_type: separator
      name: Cleaning
      icon: mdi:robot-vacuum
      styles: |
        .bubble-line { 
          background-color: grey !important; 
          height: 5px !important; 
        }
    - type: conditional
      conditions:
      - condition: or
        conditions:
          - entity: sensor.roborock_qrevo_s5v_vacuum_error
            state_not: "none"
          - entity: sensor.roborock_qrevo_s5v_dock_dock_error
            state_not: "ok"
      card:
      - type: horizontal-stack
        cards:
        - type: custom:mushroom-chips-card
          alignment: center
          card_mod:
            style: |
              ha-card {
                --chip-box-shadow: none;
                --chip-background: rgba(255, 255, 255, 0.05);
                --chip-spacing: 8px;
                padding: 0px;
                border: none;
              }
          chips:
            - type: conditional
              conditions:
                - entity: sensor.roborock_qrevo_s5v_vacuum_error
                  state_not: none
              chip:
                type: template
                icon: mdi:robot-vacuum-alert
                icon_color: red
                content: >-
                  {{ states('sensor.roborock_qrevo_s5v_vacuum_error') | replace('_',' ') | capitalize }}
                tap_action:
                  action: more-info
                  entity: sensor.roborock_qrevo_s5v_vacuum_error
                card_mod:
                  style: |
                    :host {
                      display: inline-block !important;
                      --chip-background: rgba(255, 0, 0, 0.15);
                      border: none;
                    }
            - type: conditional
              conditions:
                - entity: sensor.roborock_qrevo_s5v_dock_dock_error
                  state_not: ok
              chip:
                type: template
                icon: mdi:alert-box
                icon_color: red
                content: >-
                  {{ states('sensor.roborock_qrevo_s5v_dock_dock_error') | replace('_',' ') | capitalize }}
                tap_action:
                  action: more-info
                  entity: sensor.roborock_qrevo_s5v_dock_dock_error
                card_mod:
                  style: |
                    :host {
                      display: inline-block !important;
                      --chip-background: rgba(255, 0, 0, 0.15);
                      border: none;
                    }
    - type: horizontal-stack
      cards:
      - type: custom:mushroom-chips-card
        alignment: start
        chips:
          - type: template
            entity: sensor.roborock_qrevo_s5v_last_clean_end
            content: >-
              Last clean: {{ states('sensor.roborock_qrevo_s5v_last_clean_end') | as_timestamp | timestamp_custom('%m/%d %I:%M%p') }}
            card_mod:
              style: |
                ha-card {
                  background: none !important;
                  border: none !important;
                  box-shadow: none !important;
                }
      - type: custom:mushroom-chips-card
        alignment: end
        chips:
          - type: entity
            entity: input_boolean.rocky_clean_on_proximity
            name: Clean on Proximity
            content_info: name
            tap_action:
              action: toggle
            # Optional: adds a distinct icon color when the boolean is on
            use_entity_picture: false
            icon_color: blue
    - type: custom:vertical-stack-in-card
      cards:
        - type: horizontal-stack
          cards:
            - type: custom:bubble-card
              card_type: select
              entity: input_select.rocky_mop_intensity_list
              icon: mdi:water
              icon_color: lightblue
              name: Mop
              styles: >
                .bubble-select-card-container {
                  border-radius: 0px;
                }

                .bubble-icon {
                  color: dodgerblue !important;
                }

                ${card.querySelector('.bubble-name').innerText = hass.states['input_select.rocky_mop_intensity_list'].state}
            - type: custom:bubble-card
              card_type: select
              entity: input_select.roborock_fan_speed
              icon: mdi:fan
              name: Suction
              styles: >
                .bubble-select-card-container {
                  border-radius: 0px;
                }

                .bubble-icon {
                  color: white !important;
                }

                ${card.querySelector('.bubble-name').innerText = hass.states['input_select.roborock_fan_speed'].state}
        - show_state: false
          show_name: false
          fit_mode: fill
          camera-view: live
          type: picture-entity
          entity: image.roborock_qrevo_s5v_map
          card_mod:
            style: |
              ha-card {
                background: none !important;
                border-radius: 20px !important;
                border: 0px !important;
                padding: 0px !important;
              }
        - type: custom:mushroom-chips-card
          alignment: center
          chips:
            - type: conditional
              conditions:
                - entity: binary_sensor.roborock_qrevo_s5v_cleaning
                  state: 'on'
                - entity: vacuum.roborock_qrevo_s5v
                  state_not: paused
              chip:
                type: template
                icon: mdi:pause
                icon_color: amber
                content: Pause
                tap_action:
                  action: call-service
                  service: vacuum.pause
                  target:
                    entity_id: vacuum.roborock_qrevo_s5v
                card_mod:
                  style: |
                    ha-card {
                      background: none !important;
                      border-radius: 20px !important;
                      border: 1px solid var(--divider-color) !important;
                      padding: 0px !important;
                    }
            - type: conditional
              conditions:
                - entity: binary_sensor.roborock_qrevo_s5v_cleaning
                  state: 'on'
                - entity: vacuum.roborock_qrevo_s5v
                  state: paused
              chip:
                type: template
                icon: mdi:arrow-right-circle-outline
                icon_color: green
                content: Resume
                tap_action:
                  action: call-service
                  service: vacuum.start
                  target:
                    entity_id: vacuum.roborock_qrevo_s5v
                card_mod:
                  style: |
                    ha-card {
                      background: none !important;
                      border-radius: 20px !important;
                      border: 1px solid var(--divider-color) !important;
                      padding: 0px !important;
                    }
            - type: conditional
              conditions:
                - entity: binary_sensor.roborock_qrevo_s5v_cleaning
                  state: 'on'
              chip:
                type: template
                icon: mdi:home-import-outline
                icon_color: blue
                content: Cancel
                tap_action:
                  action: call-service
                  service: script.rocky_cancel_and_dock
                card_mod:
                  style: |
                    ha-card {
                      background: none !important;
                      border-radius: 20px !important;
                      border-outline: solid !important;
                      padding: 0px !important;
                    }
            - type: conditional
              conditions:
                - entity: binary_sensor.roborock_qrevo_s5v_cleaning
                  state_not: 'on'
                - entity: binary_sensor.roborock_qrevo_s5v_charging
                  state_not: 'on'
                - entity: sensor.roborock_qrevo_s5v_status
                  state_not: returning_home
              chip:
                type: template
                icon: mdi:home-import-outline
                icon_color: blue
                content: Return
                tap_action:
                  action: call-service
                  service: vacuum.return_to_base
                  target:
                    entity_id: vacuum.roborock_qrevo_s5v
                card_mod:
                  style: |
                    ha-card {
                      background: none !important;
                      border-radius: 20px !important;
                      border-outline: solid !important;
                      padding: 0px !important;
                    }
        - type: custom:button-card
          color_type: blank-card
          styles:
            card:
              - height: 5px
        - type: custom:mushroom-template-card
          primary: >-
            {% set status = states('sensor.roborock_qrevo_s5v_status') %} {%
            set mapper = {
              'washing_the_mop': 'Washing Mop',
              'washing_the_mop_2': 'Washing Mop',
              'emptying_the_bin': 'Emptying Dustbin',
              'air_drying_stopping': 'Drying Mop',
              'returning_home': 'Returning to Dock',
              'segment_cleaning': 'Room Cleaning',
              'segment_mopping': 'Room Mopping',
              'going_to_wash_the_mop': 'Going to Wash Mop'
            } %} 
            {{ mapper.get(status, status | replace('_', ' ') | capitalize) }}
          secondary: >-
            {% if is_state('binary_sensor.roborock_qrevo_s5v_cleaning','on') %}
              {{ states('sensor.roborock_qrevo_s5v_cleaning_progress') }}%
            {% else %}
              {{ "Ready" }}
            {% endif %}
          icon: mdi:robot-vacuum
          icon_color: |-
            {% if is_state('vacuum.roborock_qrevo_s5v', 'cleaning') %}
              green
            {% else %}
              disabled
            {% endif %}
          card_mod:
            style: |
              ha-card {
                background: rgba(255, 255, 255, 0.05);
                border-radius: 12px;
              }
    - type: custom:vertical-stack-in-card
      card_mod:
        style: |
          ha-card {
            
          }
      cards:
        - type: custom:layout-card
          layout_type: custom:grid-layout
          layout:
            grid-template-columns: 1fr 2fr
            grid-gap: 0px
          cards:
            - type: custom:mushroom-template-card
              primary: Apartment
              icon: mdi:home
              icon_color: green
              layout: vertical
              tap_action:
                action: call-service
                service: script.rocky_add_to_queue
                service_data:
                  room_id: 99
              card_mod:
                style: |
                  ha-card {
                    border: none;
                  }
            - type: custom:vertical-stack-in-card
              card_mod:
                style: |
                  ha-card {
                    border: none;
                  }
              cards:
                - type: horizontal-stack
                  cards:
                    - type: custom:mushroom-template-card
                      primary: Kitchen
                      icon: mdi:silverware-fork-knife
                      icon_color: blue
                      layout: vertical
                      tap_action:
                        action: call-service
                        service: script.rocky_add_to_queue
                        service_data:
                          room_id: 4
                      card_mod:
                        style: |
                          ha-card {
                            border: none;
                          }
                    - type: custom:mushroom-template-card
                      primary: Living
                      icon: mdi:sofa
                      icon_color: orange
                      layout: vertical
                      tap_action:
                        action: call-service
                        service: script.rocky_add_to_queue
                        service_data:
                          room_id: 1
                      card_mod:
                        style: |
                          ha-card {
                            border: none;
                          }
                - type: horizontal-stack
                  cards:
                    - type: custom:mushroom-template-card
                      primary: Bedroom
                      icon: mdi:bed
                      icon_color: light-blue
                      layout: vertical
                      tap_action:
                        action: call-service
                        service: script.rocky_add_to_queue
                        service_data:
                          room_id: 2
                      card_mod:
                        style: |
                          ha-card {
                            border: none;
                          }
                    - type: custom:mushroom-template-card
                      primary: Bathroom
                      icon: mdi:bathtub
                      icon_color: red
                      layout: vertical
                      tap_action:
                        action: call-service
                        service: script.rocky_add_to_queue
                        service_data:
                          room_id: 3
                      card_mod:
                        style: |
                          ha-card {
                            border: none;
                          }
    - type: custom:bubble-card
      card_type: separator
      name: Queue
      icon: mdi:robot-vacuum
      styles: |
        .bubble-line { 
          background-color: grey !important; 
          height: 5px !important; 
        }
    - type: custom:vertical-stack-in-card
      cards:
        - type: markdown
          content: >
            {% set room_names = {
              '1': 'Living Room',
              '2': 'Bedroom',
              '3': 'Bathroom',
              '4': 'Kitchen',
              '99': 'Apartment'
            } %}

            {% set raw_state = states('input_text.rocky_queue') %} 
            {% if raw_state not in [''] %}
              {% set queue = raw_state.split(';') %}
              {% set current = queue[0] %}
              {% set details = current.split(',') %}
              {% set room_id = details[0] %}
              **{{ room_names[room_id] if room_id in room_names else 'Room ' ~ room_id }}** 
              Mop: {{ details[1] | title }} | Vacuum: {{ details[2] | title }} 
            {% else %}
              <div style="text-align: center; padding: 10px; opacity: 0.5;">
                *Nothing is running. House is clean!* ✨
              </div>
            {% endif %}
          card_mod:
            style: |
              ha-card {
                border: none;
              }
        - type: conditional
          conditions:
            - entity: binary_sensor.rocky_queue_exists
              state: 'on'
          card:
            type: markdown
            content: >
              ### Cleaning Queue

              {% set room_names = {
                '0': 'Apartment',
                '1': 'Living Room',
                '2': 'Bedroom',
                '3': 'Bathroom',
                '4': 'Kitchen',
                '99': 'Apartment'
              } %}

              {% set raw_state = states('input_text.rocky_queue') %} {% if
              raw_state not in [''] %}
                {% set queue = raw_state.split(';') %}
                {% for item in queue[1:] %}
                  {% set details = item.split(',') %}
                  {% set room_id = details[0] %}
              **{{loop.index}}: {{ room_names[room_id] if room_id in
              room_names else 'Room ' ~ room_id }}**
                Mop: {{ details[1] | title }}  |  Vacuum: {{ details[2] | title }}
                {% endfor %}
              {% endif %}
            card_mod:
              style: |
                ha-card {
                  border: none;
                }
        - type: conditional
          conditions:
            - entity: binary_sensor.rocky_queue_exists
              state: 'on'
          card:
            type: custom:mushroom-entity-card
            entity: input_text.rocky_queue
            name: Clear Cleaning Queue
            icon: mdi:broom
            icon_color: red
            tap_action:
              action: call-service
              service: script.rocky_clear_upcoming_queue
            layout: horizontal
            secondary_info: none
            card_mod:
              style: |
                ha-card {
                  border: none;
                  background: rgba(255, 0, 0, 0.15) !important;
                }
    - type: custom:bubble-card
      card_type: separator
      name: Maintenance
      icon: mdi:robot-vacuum
      styles: |
        .bubble-line { 
          background-color: grey !important; 
          height: 5px !important; 
        }
    - type: entities
      entities:
        - entity: sensor.roborock_qrevo_s5v_filter_time_left
          name: Filter
        - entity: sensor.roborock_qrevo_s5v_side_brush_time_left
          name: Side Brush
        - entity: sensor.roborock_qrevo_s5v_main_brush_time_left
          name: Main Brush
        - entity: sensor.roborock_qrevo_s5v_sensor_time_left
          name: Sensors
      card_mod:
        style: |
          ha-card {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 12px;
          }
            
    - type: custom:button-card
      color_type: blank-card
      styles:
        card:
          - height: 100px
