type: custom:bubble-card
card_type: pop-up
hash: '#episode_popup'
name: "Episode"
popup_style: classic
icon: mdi:information-outline
bg_blur: true
cards:
  - type: markdown
    card_mod:
      style: |
        ha-card {
          border: none !important;
          box-shadow: none !important;
          background: transparent !important;
        }
    content: >
      {% set search_sensor = 'sensor.tmdb_episodes' %}
      {% set selected_id = states('input_text.tmdb_selected_episode') %}
      
      {% set all_items = state_attr(search_sensor, 'episodes') %}
                  
      {% set match = namespace(item=none) %}
      {% for item in all_items %}
        {% if item.episode == selected_id %}
          {% set match.item = item %}
        {% endif %}
      {% endfor %}

      {% if match.item %}
        <div style="display: flex; gap: 16px; align-items: flex-start;">
          <img src="{{ match.item.poster }}" style="width: 100%; display: block; border-radius: 12px 12px 0 0; aspect-ratio: 16/9; object-fit: cover;" />
          <div>
            <h2 style="margin: 0 0 8px 0;">{{ match.item.episode_name }} (S{{ states('input_text.tmdb_selected_season') }}E{{ states('input_text.tmdb_selected_episode') }})</h2>
            <p style="margin: 0 0 8px 0;">{{ match.item.runtime | default('N/A', true) }} minutes</p>
            <p style="margin: 0 0 4px 0; color: var(--secondary-text-color);">
              <b>Release:</b> {{ match.item.release_date | default('N/A', true) }} | 
              <b>Rating:</b> ★ {{ match.item.vote_average | default(0, true) | round(1) }}
            </p>
            <p style="margin: 8px 0 0 0; line-height: 1.4;">{{ match.item.description | default('No overview available.', true) }}</p>
          </div>
        </div>
      {% else %}
        <p>Episode not found.</p> 
      {% endif %}
  - type: custom:button-card
    name: Send to Kodi
    icon: mdi:play
    tap_action:
      action: call-service
      service: script.play_media_in_kodi_fenlight
    styles:
      card:
        - background-color: var(--secondary-background-color)
        - border-radius: 8px
        - padding: 6px 12px
        - height: 80px
      icon:
        - width: 40px
      name:
        - font-size: 13px
        - justify-self: center
        - padding-left: 8px